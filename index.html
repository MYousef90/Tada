<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06233f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="DagStart Pro"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>DagStart Pro</title><style>
:root{--navy:#06233f;--navy2:#0a3c64;--green:#16c47f;--blue:#2687ff;--orange:#ff702a;--purple:#8257ec;--bg:#eef3f7;--card:#fff;--text:#09213a;--muted:#6e7f90;--line:#dce5ec;--shadow:0 10px 28px rgba(5,32,58,.12)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:88px}.hero{background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;padding:calc(22px + env(safe-area-inset-top)) 20px 30px;border-radius:0 0 30px 30px}.top{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-size:22px;font-weight:800}.brand b{color:var(--green)}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#19e397,#0aa668);display:grid;place-items:center;font-size:24px}.date{font-size:13px;opacity:.75}.hero h1{font-size:29px;margin:27px 0 5px}.hero p{margin:0;opacity:.82}.quote{margin-top:20px;font-size:13px;font-style:italic;opacity:.8}.content{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:-38px}.metric{border:0;color:#fff;text-align:left;border-radius:20px;padding:17px;box-shadow:var(--shadow);min-height:112px;cursor:pointer}.metric .icon{font-size:25px}.metric strong{display:block;font-size:28px;margin:8px 0 2px}.metric small{opacity:.9}.blue{background:linear-gradient(145deg,#3996ff,#1665e9)}.green{background:linear-gradient(145deg,#24d68d,#08a968)}.orange{background:linear-gradient(145deg,#ff8539,#fa551d)}.purple{background:linear-gradient(145deg,#976eff,#6a3bd8)}.card{background:var(--card);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 7px 22px rgba(6,35,63,.08)}.card h2{font-size:18px;margin:0 0 14px}.progress-row{display:flex;align-items:center;gap:15px}.ring{width:72px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),#e2e9ed 0);position:relative;font-weight:800}.ring:before{content:"";position:absolute;width:54px;aspect-ratio:1;background:#fff;border-radius:50%}.ring span{position:relative}.bar{height:9px;background:#e2e9ed;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--green);width:0}.screen{display:none}.screen.active{display:block}.screen-head{display:flex;align-items:center;gap:12px;margin:2px 0 15px}.back,.round{border:0;background:#fff;border-radius:13px;padding:10px 13px;cursor:pointer}.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{width:22px;height:22px;accent-color:var(--green)}.task.done span{text-decoration:line-through;color:var(--muted)}.empty{color:var(--muted);font-size:14px;text-align:center;padding:15px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:#f9fbfc;color:var(--text)}.field textarea{min-height:90px;resize:vertical}.primary{width:100%;border:0;border-radius:14px;padding:13px;background:linear-gradient(145deg,#20d58b,#09a968);color:#fff;font-weight:800;cursor:pointer}.secondary{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;cursor:pointer}.list-item{background:#fff;padding:14px;border-radius:15px;margin:9px 0;box-shadow:0 4px 13px rgba(6,35,63,.06)}.list-item b{display:block}.list-item small{color:var(--muted)}.pill{display:inline-block;font-size:11px;padding:4px 8px;border-radius:99px;background:#eaf8f2;color:#078a58;margin-top:7px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;color:#6f8092;font-size:10px;padding:5px 1px;cursor:pointer}.nav button span{display:block;font-size:21px;margin-bottom:2px}.nav button.active{color:#08a968;font-weight:800}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#09213a;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;display:none;z-index:9}.install{display:none;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:8px 11px;cursor:pointer}@media(max-width:350px){.content{padding:12px}.hero{padding-left:15px;padding-right:15px}.metric{padding:14px}}
</style></head><body><main class="app"><section id="home" class="screen active"><header class="hero"><div class="top"><div class="brand"><div class="logo">✓</div>DagStart <b>Pro</b></div><button id="installBtn" class="install">Installeren</button></div><h1>Goedemorgen, Michael!</h1><p id="today"></p><div class="quote">“Samen elke dag een beetje beter.”</div></header><div class="content"><div class="grid"><button class="metric blue" data-go="dagstart"><div class="icon">📋</div><strong id="openCount">0</strong><small>Open acties</small></button><button class="metric green" data-go="ideeen"><div class="icon">💡</div><strong id="ideaCount">0</strong><small>Verbeterideeën</small></button><button class="metric orange" data-go="storingen"><div class="icon">⚠️</div><strong id="faultCount">0</strong><small>Storingen</small></button><button class="metric purple" data-go="veiligheid"><div class="icon">🛡️</div><strong id="safetyCount">0</strong><small>Veiligheidsmeldingen</small></button></div><div class="card"><h2>Dagstart voortgang</h2><div class="progress-row"><div class="ring" id="ring" style="--p:0"><span id="percent">0%</span></div><div style="flex:1"><b id="progressText">Nog geen acties</b><div class="bar"><i id="barFill"></i></div></div></div></div><div class="card"><h2>Vandaag</h2><div id="homeTasks"></div></div></div></section>
<section id="dagstart" class="screen"><div class="content"><div class="screen-head"><button class="back" data-go="home">‹</button><h1>Dagstart</h1></div><div class="card"><h2>Checklist van vandaag</h2><div id="taskList"></div><div class="field"><label for="newTask">Nieuwe actie</label><input id="newTask" maxlength="100" placeholder="Bijv. planning lijn 3 doornemen"></div><button class="primary" id="addTask">+ Actie toevoegen</button></div></div></section>
<section id="ideeen" class="screen"><div class="content"><div class="screen-head"><button class="back" data-go="home">‹</button><h1>Verbeterideeën</h1></div><div class="card"><div class="field"><label for="ideaTitle">Titel</label><input id="ideaTitle" maxlength="80" placeholder="Kort verbeteridee"></div><div class="field"><label for="ideaText">Toelichting</label><textarea id="ideaText" maxlength="350" placeholder="Wat kan beter en wat levert het op?"></textarea></div><button class="primary" id="addIdea">Idee opslaan</button></div><div id="ideaList"></div></div></section>
<section id="storingen" class="screen"><div class="content"><div class="screen-head"><button class="back" data-go="home">‹</button><h1>Storing melden</h1></div><div class="card"><div class="field"><label for="machine">Machine / lijn</label><input id="machine" maxlength="50" placeholder="Bijv. Lijn 3"></div><div class="field"><label for="faultType">Type storing</label><select id="faultType"><option>Mechanisch</option><option>Elektrisch</option><option>Proces</option><option>Overig</option></select></div><div class="field"><label for="faultText">Beschrijving</label><textarea id="faultText" maxlength="350" placeholder="Beschrijf kort wat er aan de hand is"></textarea></div><button class="primary" id="addFault">Storing opslaan</button></div><div id="faultList"></div></div></section>
<section id="veiligheid" class="screen"><div class="content"><div class="screen-head"><button class="back" data-go="home">‹</button><h1>Veiligheid</h1></div><div class="card"><div class="field"><label for="safetyText">Veiligheidsmelding</label><textarea id="safetyText" maxlength="350" placeholder="Wat heb je gezien en waar?"></textarea></div><button class="primary" id="addSafety">Melding opslaan</button></div><div id="safetyList"></div></div></section>
<section id="meer" class="screen"><div class="content"><div class="screen-head"><button class="back" data-go="home">‹</button><h1>Meer</h1></div><div class="card"><h2>DagStart Pro</h2><p>Alle gegevens worden alleen op dit apparaat opgeslagen.</p><button class="secondary" id="reset">Alle testgegevens wissen</button></div></div></section></main>
<nav class="nav"><button class="active" data-go="home"><span>⌂</span>Home</button><button data-go="dagstart"><span>☑</span>Dagstart</button><button data-go="storingen"><span>⚠</span>Storingen</button><button data-go="ideeen"><span>💡</span>Ideeën</button><button data-go="meer"><span>☰</span>Meer</button></nav><div class="toast" id="toast" aria-live="polite"></div>
<script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const KEY='dagstart-pro-v1';const initial={tasks:[{id:1,text:'Planning doornemen',done:false},{id:2,text:'Veiligheidsronde uitvoeren',done:false},{id:3,text:'Bijzonderheden met het team bespreken',done:false}],ideas:[],faults:[],safety:[]};let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial}catch{state=initial}const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}function go(id){$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.go===id));scrollTo(0,0);render()}$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));function render(){const done=state.tasks.filter(t=>t.done).length,total=state.tasks.length,p=total?Math.round(done/total*100):0;$('#openCount').textContent=total-done;$('#ideaCount').textContent=state.ideas.length;$('#faultCount').textContent=state.faults.length;$('#safetyCount').textContent=state.safety.length;$('#ring').style.setProperty('--p',p);$('#percent').textContent=p+'%';$('#barFill').style.width=p+'%';$('#progressText').textContent=total?done+' van '+total+' acties voltooid':'Nog geen acties';const tasks=state.tasks.map(t=>`<label class="task ${t.done?'done':''}"><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><span>${esc(t.text)}</span></label>`).join('')||'<div class="empty">Nog geen acties toegevoegd.</div>';$('#taskList').innerHTML=tasks;$('#homeTasks').innerHTML=state.tasks.filter(t=>!t.done).slice(0,4).map(t=>`<div class="task"><span>○</span><span>${esc(t.text)}</span></div>`).join('')||'<div class="empty">Alles is afgerond. Goed bezig!</div>';$$('[data-task]').forEach(c=>c.addEventListener('change',()=>{const t=state.tasks.find(x=>x.id==c.dataset.task);t.done=c.checked;save()}));$('#ideaList').innerHTML=state.ideas.slice().reverse().map(x=>`<div class="list-item"><b>${esc(x.title)}</b><div>${esc(x.text)}</div><span class="pill">Verbeteridee</span></div>`).join('');$('#faultList').innerHTML=state.faults.slice().reverse().map(x=>`<div class="list-item"><b>${esc(x.machine)} · ${esc(x.type)}</b><div>${esc(x.text)}</div><span class="pill">Open melding</span></div>`).join('');$('#safetyList').innerHTML=state.safety.slice().reverse().map(x=>`<div class="list-item"><b>Veiligheidsmelding</b><div>${esc(x.text)}</div><span class="pill">Geregistreerd</span></div>`).join('')}$('#addTask').addEventListener('click',()=>{const v=$('#newTask').value.trim();if(!v)return toast('Vul eerst een actie in');state.tasks.push({id:Date.now(),text:v,done:false});$('#newTask').value='';save();toast('Actie toegevoegd')});$('#addIdea').addEventListener('click',()=>{const a=$('#ideaTitle'),b=$('#ideaText');if(!a.value.trim()||!b.value.trim())return toast('Vul titel en toelichting in');state.ideas.push({id:Date.now(),title:a.value.trim(),text:b.value.trim()});a.value=b.value='';save();toast('Idee opgeslagen')});$('#addFault').addEventListener('click',()=>{const a=$('#machine'),b=$('#faultText');if(!a.value.trim()||!b.value.trim())return toast('Vul machine en beschrijving in');state.faults.push({id:Date.now(),machine:a.value.trim(),type:$('#faultType').value,text:b.value.trim()});a.value=b.value='';save();toast('Storing opgeslagen')});$('#addSafety').addEventListener('click',()=>{const a=$('#safetyText');if(!a.value.trim())return toast('Vul de melding in');state.safety.push({id:Date.now(),text:a.value.trim()});a.value='';save();toast('Melding opgeslagen')});$('#reset').addEventListener('click',()=>{state=JSON.parse(JSON.stringify(initial));save();toast('Testgegevens gewist')});$('#today').textContent=new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());let prompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();prompt=e;$('#installBtn').style.display='block'});$('#installBtn').addEventListener('click',async()=>{if(prompt){prompt.prompt();await prompt.userChoice;prompt=null;$('#installBtn').style.display='none'}});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render()})();
</script></body></html>
